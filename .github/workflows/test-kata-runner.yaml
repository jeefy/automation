name: Test Kata Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runner:
    strategy:
      matrix:
        shape: [8cpu-32gb]
        arch: ["x86-64"]
    runs-on: oracle-kata-${{ matrix.shape }}-${{ matrix.arch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify kata guest kernel and environment
        run: |
          uname -a
          lsb_release -a || cat /etc/os-release
          id
          echo "Guest kernel should differ from the OKE host kernel:"
          cat /proc/version

      - name: Verify docker works with fuse-overlayfs
        run: |
          docker info
          docker info --format '{{.Driver}}'
          docker run hello-world

      - name: Run a basic workload
        run: |
          echo "Testing Runner"
          echo "CPU Info:"
          lscpu
          docker run --rm alpine:3 sh -c 'echo nested container OK'

      - name: Check local disk
        run: |
          df -h /
          df -h /home/runner/_work
