name: Test Kata Runner

# Manual smoke test of the promoted kata runners (the same checks the nightly
# canary runs against a candidate digest before promotion).
on:
  workflow_dispatch:
    inputs:
      size:
        description: Runner size label suffix
        type: choice
        default: 2cpu-8gb
        options: [2cpu-8gb, 8cpu-32gb]

permissions:
  contents: read

jobs:
  test-runner:
    runs-on: oracle-kata-${{ inputs.size }}-x86-64
    timeout-minutes: 40
    services:
      nginx:
        image: nginx:alpine
        ports:
          - 18081:80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/kata-runner-smoke
        with:
          service-url: http://127.0.0.1:18081/
