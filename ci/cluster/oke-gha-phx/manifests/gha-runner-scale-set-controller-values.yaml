metrics:
  controllerManagerAddr: ":8080"
  listenerAddr: ":8080"
  listenerEndpoint: "/metrics"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "8080"

flags:
  # Empty: watch every namespace (chart then installs cluster-scoped RBAC).
  # Needed so the controller reconciles the kata canary scale sets in the
  # dedicated kata-canary namespace (manifests/kata-canary/). Production scale
  # sets stay in arc-systems.
  watchSingleNamespace: ""
  runnerMaxConcurrentReconciles: 10

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
