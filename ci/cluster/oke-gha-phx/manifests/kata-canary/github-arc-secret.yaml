# Same GitHub app/PAT as arc-systems, synced from the same OCI vault entry so
# canary scale sets can register runners at the enterprise.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-arc-secret
  namespace: kata-canary
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-secret-store
  target:
    name: github-arc-secret
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: github-arc-secret
